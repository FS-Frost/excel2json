<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="description" content="Convert and edit Excel, CSV and JSON in your browser. Nothing is uploaded." />
		<script>
			// Antes de pintar: tema concreto (light/dark) e idioma. Ver lib/client/theme.svelte.ts y lib/i18n.
			(function () {
				var root = document.documentElement;
				try {
					var t = localStorage.getItem('excel2json.theme');
					var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					root.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					root.dataset.theme = 'light';
				}
				try {
					var l = localStorage.getItem('excel2json.lang');
					if (l !== 'es' && l !== 'en') {
						var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
						l = 'en';
						for (var i = 0; i < langs.length; i++) if (/^es\b/i.test(langs[i])) l = 'es';
					}
					root.lang = l;
				} catch (e) {}
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="excel2json" />
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
