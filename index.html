				try {
					var t = localStorage.getItem('excel2json.theme');
					var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					root.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					root.dataset.theme = 'light';
				}
				try {

						l = 'en';
						for (var i = 0; i < langs.length; i++) if (/^es\b/i.test(langs[i])) l = 'es';
					}
					root.lang = l;
				} catch (e) {}
			})();
