name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test-build-deploy:
        runs-on: ubuntu-latest
        # Publica en la rama gh-pages con el token del workflow.
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            # Bun fijo (el mismo que en desarrollo): una versión nueva no debe romper el deploy sin aviso.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Type check
              run: bun run check

            - name: Run tests
              run: bun test

            # Base del sitio: /<repo> (o vacía si el repo es <usuario>.github.io).
            - name: Build
              run: |
                  REPO="${{ github.event.repository.name }}"
                  if [[ "$REPO" == *.github.io ]]; then export BASE_PATH=""; else export BASE_PATH="/$REPO"; fi
                  bun run build

            # SPA: index.html para la raíz y 404.html para cualquier ruta.
            - name: SPA entry points
              run: cp build/404.html build/index.html

            - name: Generate .nojekyll
              run: echo "" > build/.nojekyll

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: build
